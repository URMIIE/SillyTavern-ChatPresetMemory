<div id="cpm_settings" class="cpm-settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>채팅별 프리셋·토글 기억</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <small class="cpm-help">채팅마다 마지막으로 쓴 프리셋과, 프리셋마다 켜 둔 토글을 기억해요. 채팅을 다시 열면 그대로 맞추고, 채팅 안에서 프리셋을 바꾸면 그 프리셋으로 쓰던 토글이 켜져요. 프롬프트 목록 위 스위치로 채팅마다 끄고, ⓘ 로 기억한 내용을 볼 수 있어요.</small>
            <label class="checkbox_label" for="cpm_enabled">
                <input type="checkbox" id="cpm_enabled">
                <span>켜기</span>
            </label>
            <label class="checkbox_label" for="cpm_restorePreset">
                <input type="checkbox" id="cpm_restorePreset">
                <span>채팅을 열 때 마지막 프리셋으로도 바꾸기 (끄면 프리셋은 그대로 두고, 고른 프리셋에 이 채팅에서 쓰던 토글만 맞춤)</span>
            </label>
            <label class="checkbox_label" for="cpm_charDefault">
                <input type="checkbox" id="cpm_charDefault">
                <span>새 채팅은 그 캐릭터의 마지막 설정으로 시작</span>
            </label>
            <label class="checkbox_label" for="cpm_notify">
                <input type="checkbox" id="cpm_notify">
                <span>설정을 맞췄을 때 알림 보이기</span>
            </label>
            <div class="flex-container">
                <div id="cpm_clear_chars" class="menu_button menu_button_icon">
                    <i class="fa-solid fa-eraser"></i>
                    <span>캐릭터 기본값 지우기</span>
                </div>
            </div>
        </div>
    </div>
</div>
